[project]
name = "frayid"
version = "0.1.0"
description = "Canonical clothed-surface reconstruction from monocular self-rotation video."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "FrayID Contributors" }]
dependencies = [
  "numpy>=1.26,<3",
  "osqp==1.1.3",
  "opencv-python>=4.9",
  "Pillow>=10",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "rich>=13.7",
  "rtree>=1.4",
  "scikit-image>=0.24",
  "scipy>=1.12",
  "torch>=2.4",
  "trimesh>=4.4",
  "typer>=0.12",
]

[project.optional-dependencies]
modal = ["modal[api-proxy-support]>=1.1"]
smpl = ["smplx>=0.1.28"]
collision = ["ipctk==1.6.0"]
dev = [
  "clarabel==0.11.1",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "types-PyYAML>=6.0",
]

[project.scripts]
frayid = "frayid.active_cli:app"
frayid-legacy = "frayid.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frayid"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["smplx", "smplx.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["frayid"]
branch = true
